[build-system]
requires = ["setuptools>=66.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karius-academic-system"
version = "1.0.0"
description = "Karius Academic System (KAS) — Hệ thống quản trị tri thức, đa kho dữ liệu (Local/Google Drive), tùy chỉnh quy tắc đặt tên & kết nối AI/MCP Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "kariusnocr" }
]
keywords = ["karius-academic-system", "kas", "multi-vault", "google-drive", "local-storage", "naming-rules", "mcp", "ai-agent", "vietnamese", "ocr", "sqlite", "desktop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "openpyxl>=3.0.9",
]

[project.optional-dependencies]
drive-api = [
  "google-api-python-client>=2.100.0",
  "google-auth>=2.23.0",
  "google-auth-oauthlib>=1.1.0",
  "google-auth-httplib2>=0.1.1",
]
media = [
  "Pillow>=9.4.0",
  "numpy>=1.24.0",
]
web = [
  "fastapi>=0.92.0",
  "uvicorn>=0.17.6",
]
desktop = [
  "fastapi>=0.92.0",
  "uvicorn>=0.17.6",
  "pywebview>=5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "wheel>=0.40.0",
  "httpx>=0.27.0",
]
all = [
  "karius-academic-system[drive-api,media,web,desktop]",
]

[project.scripts]
kas = "karius_academic_system.cli.main:main"
kas-desktop = "karius_academic_system.web.desktop:main"

[project.urls]
Homepage = "https://github.com/kariusnocr/storage-management-suite"
Repository = "https://github.com/kariusnocr/storage-management-suite"
Issues = "https://github.com/kariusnocr/storage-management-suite/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["karius_academic_system*"]

[tool.setuptools.package-data]
karius_academic_system = ["data/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/karius_academic_system/core/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
