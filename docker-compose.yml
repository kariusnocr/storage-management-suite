services:
  kas:
    build: .
    image: karius-academic-system:5.0.0
    container_name: kas-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      KAS_DATA_DIR: /data
      KAS_CONFIG_DIR: /config
      KAS_BACKEND: auto
    volumes:
      - kas_data:/data
      - kas_config:/config
      # Gắn thư mục cục bộ bất kỳ của bạn vào /vaults để quản lý trực tiếp trong KAS:
      # - /duong/dan/kho/cua/ban:/vaults/tai-lieu

volumes:
  kas_data:
  kas_config:
