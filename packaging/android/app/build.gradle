plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.kariusnocr.kas'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.kariusnocr.kas"
        minSdk 26
        targetSdk 34
        versionCode 10900
        versionName "1.9.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KAS_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KAS_KEYSTORE_PASS")
                keyAlias System.getenv("KAS_KEY_ALIAS")
                keyPassword System.getenv("KAS_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksPath = System.getenv("KAS_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        extractPackages "karius_academic_system"
        pip {
            install "certifi"
        }
        pyc {
            src false
            pip false
        }
    }
}

dependencies {
}
