name: Release KAS Software Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build Python Wheel, Source Dist & Windows SAC-safe ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist, wheel & Windows SAC-safe bundle
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
          python3 packaging/build_sac_bundle.py --dist-dir dist --out dist/kas-windows-sac-safe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-binaries:
    name: Build Standalone Binary (${{ matrix.os_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux-x64
            ext: ""
          - os: windows-latest
            os_label: windows-x64
            ext: ".exe"
          - os: macos-latest
            os_label: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[media,web,drive-api]" pyinstaller
      - name: Build CLI + Web UI standalone binary
        run: |
          python packaging/build_binary.py --mode cli
      - name: Rename and smoke-test artifact with OS tag
        shell: bash
        run: |
          mv "dist/kas${{ matrix.ext }}" "dist/kas-${{ matrix.os_label }}${{ matrix.ext }}"
          ./dist/kas-${{ matrix.os_label }}${{ matrix.ext }} version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_label }}
          path: dist/kas-${{ matrix.os_label }}${{ matrix.ext }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-wheel, build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_assets/*
