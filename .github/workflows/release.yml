name: Release KAS Software Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build Python Wheel, Source Dist & Windows SAC-safe ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist, wheel & Windows SAC-safe bundle
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
          python3 packaging/build_sac_bundle.py --dist-dir dist --out dist/kas-windows-sac-safe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-binaries:
    name: Build Standalone Binary (${{ matrix.os_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux-x64
            ext: ""
          - os: windows-latest
            os_label: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[media,web,drive-api]" pyinstaller
      - name: Validate Windows PowerShell 5.1 script syntax
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          foreach ($psFile in @("packaging/windows/install_windows_sac_safe.ps1", "packaging/windows/uninstall_windows_sac_safe.ps1")) {
            $errs = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $psFile).Path, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error "$psFile`: $($_.ToString())" }
              exit 1
            }
            Write-Host "PowerShell 5.1 AST check PASSED (0 errors): $psFile"
          }
          python -c "from pathlib import Path; from karius_academic_system.ops.updater import _generate_windows_restart_ps1; from karius_academic_system.ops.uninstaller import _generate_windows_detached_ps1; Path('_gen_restart_stdlib.ps1').write_bytes(_generate_windows_restart_ps1(9999, r'C:\Python312\pythonw.exe', '127.0.0.1', 8765, stdlib=True, reopen_window=False).encode('ascii')); Path('_gen_restart_reopen.ps1').write_bytes(_generate_windows_restart_ps1(9999, r'C:\Python312\pythonw.exe', '127.0.0.1', 8765, stdlib=False, reopen_window=True).encode('ascii')); Path('_gen_uninstall.ps1').write_bytes(_generate_windows_detached_ps1(wait_pid=9999, python_exe=r'C:\Python312\pythonw.exe', cfg_dir=Path(r'C:\Users\Test\.config\kas'), data_root=Path(r'C:\Users\Test\.local\share\kas'), remove_config=True, remove_data=True, browser_pid=4321, port=8765).encode('ascii'))"
          foreach ($genFile in @("_gen_restart_stdlib.ps1", "_gen_restart_reopen.ps1", "_gen_uninstall.ps1")) {
            $errs = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $genFile).Path, [ref]$tokens, [ref]$errs)
            Remove-Item $genFile -Force -ErrorAction SilentlyContinue
            if ($errs -and $errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error "$genFile`: $($_.ToString())" }
              exit 1
            }
            Write-Host "PowerShell 5.1 AST check PASSED (0 errors): $genFile"
          }
      - name: Build CLI + Web UI standalone binary
        run: |
          python packaging/build_binary.py --mode cli
      - name: Rename and smoke-test artifact with OS tag
        shell: bash
        run: |
          mv "dist/kas${{ matrix.ext }}" "dist/kas-${{ matrix.os_label }}${{ matrix.ext }}"
          ./dist/kas-${{ matrix.os_label }}${{ matrix.ext }} version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_label }}
          path: dist/kas-${{ matrix.os_label }}${{ matrix.ext }}

  build-android-apk:
    name: Build Native Android APK (kas-android.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed kas-android.apk (Chaquopy Python 3.11)
        env:
          KAS_ANDROID_KEYSTORE_B64: ${{ secrets.KAS_ANDROID_KEYSTORE_B64 }}
          KAS_KEYSTORE_PASS: ${{ secrets.KAS_ANDROID_KEYSTORE_PASS }}
          KAS_KEY_ALIAS: ${{ secrets.KAS_ANDROID_KEY_ALIAS }}
          KAS_KEY_PASS: ${{ secrets.KAS_ANDROID_KEY_PASS }}
        run: |
          if [ -n "${KAS_ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "${KAS_ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/kas-release.jks"
            export KAS_KEYSTORE_PATH="${RUNNER_TEMP}/kas-release.jks"
            echo "[ANDROID] Using permanent release signing keystore."
          fi
          trap 'rm -f "${RUNNER_TEMP}/kas-release.jks"' EXIT
          for attempt in 1 2 3; do
            echo "[ANDROID] Build attempt ${attempt}/3..."
            if python3 packaging/build_android_apk.py --out dist/kas-android.apk; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "[ANDROID] Transient Gradle/Maven error; clearing metadata cache and retrying in 12s..."
            rm -rf ~/.gradle/caches/modules-2/metadata-* || true
            sleep 12
          done
          ls -lh dist/kas-android.apk
          if [ -f dist/kas-android-cert-fingerprints.txt ]; then
            cat dist/kas-android-cert-fingerprints.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/kas-android.apk
            dist/kas-android-cert-fingerprints.txt

  publish-release:
    name: Publish GitHub Release
    needs: [build-wheel, build-binaries, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Verify core artifacts & Generate SHA256SUMS.txt
        run: |
          cd release_assets
          test -f kas-android.apk
          test -f kas-windows-x64.exe
          test -f kas-linux-x64
          test -f kas-windows-sac-safe.zip
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release_assets/*
