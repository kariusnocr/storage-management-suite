name: Karius Academic System CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    name: Kiểm thử & Đóng gói KAS (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cài đặt công cụ đa phương tiện (ffmpeg, tesseract-ocr, vie, poppler, 7z, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-vie \
            poppler-utils \
            p7zip-full \
            fonts-dejavu-core

      - name: Cài đặt gói Karius Academic System (KAS) và phụ thuộc phát triển
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[media,web,drive-api,dev]"

      - name: Kiểm tra cú pháp (py_compile) & Lint (ruff)
        run: |
          python3 -m py_compile $(find src tests packaging -name '*.py')
          ruff check src tests

      - name: Quét bảo mật rò rỉ khóa/token
        run: kas github kiem-tra-bao-mat

      - name: Chạy bộ kiểm thử tự động ngoại tuyến (pytest)
        run: pytest -v --cov=karius_academic_system --cov-report=term-missing

      - name: Kiểm chứng đóng gói Wheel, Sdist, Windows SAC-safe ZIP & Android Staging
        run: |
          python3 -m build
          python3 packaging/build_sac_bundle.py --dist-dir dist --out dist/kas-windows-sac-safe.zip
          bash -n packaging/android/install_android_termux.sh
          python3 packaging/build_android_apk.py --stage-only --clean-staged
          ls -lh dist/
          kas version
          kas android info
          kas doctor || true
